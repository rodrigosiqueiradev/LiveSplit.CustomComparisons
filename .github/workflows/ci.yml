name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/CustomComparisons.Engine.Tests --nologo

  editor:
    name: Block editor build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run build

  # The LiveSplit component itself isn't built here: it compiles against LiveSplit's own
  # DLLs, which aren't redistributable from this repository. Build it locally (see README).
